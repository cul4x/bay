<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="emerald" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بَيَان | BAYAN — رحلة في أسرار اللغة العربية</title>
<meta name="description" content="بَيَان: موسوعة تفاعلية متكاملة للنحو والصرف والإملاء العربي.">
<meta name="theme-color" content="#123D32" id="meta-theme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23123D32'/%3E%3Cpath d='M60 66C50 50 32 44 14 46c6 6 6 24 6 32 16-4 32-2 40 6z' fill='%23FAF9F5'/%3E%3Cpath d='M60 66c10-16 28-22 46-20-6 6-6 24-6 32-16-4-32-2-40 6z' fill='%23FAF9F5' opacity='.8'/%3E%3Cpath d='M8 74c6 34 98 34 104 0-12 18-92 18-104 0z' fill='%23B69A68'/%3E%3Cpath d='M60 12l6 10-6 10-6-10z' fill='%23B69A68'/%3E%3C/svg%3E">
<style>
/* ============ بَيَان | BAYAN — الأنماط ============ */
:root{
  --font-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Naskh Arabic',sans-serif;
  --font-text:'Amiri','Traditional Arabic','Noto Naskh Arabic','Times New Roman',serif;
  --fs:19; --lh:1.9;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.06);
  --ok:#1f7a4d; --ok-bg:#e6f4ec; --bad:#a4332c; --bad-bg:#f9e8e6;
}
/* ---------- الثيمات (فاتح) ---------- */
[data-theme="emerald"]{
  --primary:#123D32; --secondary:#EDE5D5; --bg:#FAF9F5; --accent:#B69A68;
  --accent-text:#7B6330; --surface:#FFFFFF; --surface2:#F4EFE3; --text:#1D2A25; --muted:#5B6862;
  --border:#E3DCCB; --on-primary:#FAF9F5; --head:#123D32;
}
[data-theme="navy"]{
  --primary:#182B49; --secondary:#DCE3EB; --bg:#F7F8FA; --accent:#A6B4C5;
  --accent-text:#4D5F77; --surface:#FFFFFF; --surface2:#EEF2F6; --text:#1B2535; --muted:#586374;
  --border:#DDE3EA; --on-primary:#F7F8FA; --head:#182B49;
}
[data-theme="burgundy"]{
  --primary:#642D3A; --secondary:#E9DDCA; --bg:#FAF7F1; --accent:#B38B65;
  --accent-text:#7C5A38; --surface:#FFFFFF; --surface2:#F4ECDD; --text:#2B1D21; --muted:#6A5A5E;
  --border:#E8DDCB; --on-primary:#FAF7F1; --head:#642D3A;
}
/* ---------- الثيمات (ليلي) ---------- */
[data-theme="emerald"][data-mode="dark"]{
  --primary:#1E5A49; --bg:#0E1815; --surface:#15241F; --surface2:#1B2E27; --text:#EDE8DC; --muted:#A9B3AC;
  --border:#2A3F37; --head:#D6BE8E; --accent-text:#D6BE8E; --ok-bg:#12301f; --bad-bg:#3a1a17; --ok:#7fd1a3; --bad:#f0a199;
}
[data-theme="navy"][data-mode="dark"]{
  --primary:#2A4672; --bg:#0E1522; --surface:#162033; --surface2:#1C2A41; --text:#E8ECF1; --muted:#A3AEBC;
  --border:#2B3A55; --head:#C3CEDB; --accent-text:#C3CEDB; --ok-bg:#12301f; --bad-bg:#3a1a17; --ok:#7fd1a3; --bad:#f0a199;
}
[data-theme="burgundy"][data-mode="dark"]{
  --primary:#8A4558; --bg:#1A1013; --surface:#26171B; --surface2:#301E23; --text:#F0E6DA; --muted:#B9A9A2;
  --border:#4A2E36; --head:#D9B995; --accent-text:#D9B995; --ok-bg:#12301f; --bad-bg:#3a1a17; --ok:#7fd1a3; --bad:#f0a199;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;font-family:var(--font-ui);font-size:16px;line-height:1.7;color:var(--text);
  background:var(--bg);transition:background-color .25s,color .25s;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--head);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:1000px;margin:0 auto;padding:0 16px}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--primary);color:var(--on-primary);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{top:8px}
[hidden]{display:none!important}

/* ---------- الترويسة ---------- */
.site-header{position:sticky;top:0;z-index:40;background:var(--primary);color:var(--on-primary);border-bottom:3px solid var(--accent);transition:background-color .25s}
.header-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;color:var(--on-primary)}
.brand:hover{text-decoration:none}
.logo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);font-family:var(--font-text);font-size:26px;font-weight:700;line-height:1;padding-bottom:6px}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-family:var(--font-text);font-size:24px}
.brand-text small{letter-spacing:.3em;font-size:10px;opacity:.8;direction:ltr;text-align:start}
.actions{display:flex;gap:4px}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--on-primary)}
.icon-btn:hover{background:rgba(255,255,255,.12);text-decoration:none}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:3px;inset-inline-end:3px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#1b1b1b;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}

main{padding-top:20px;padding-bottom:40px;min-height:70vh;outline:0}
h1,h2,h3{font-family:var(--font-ui);color:var(--head);line-height:1.35;margin:0 0 .5em}

/* ---------- الواجهة الرئيسية ---------- */
.hero{background:linear-gradient(160deg,var(--primary),color-mix(in srgb,var(--primary) 75%,#000));color:var(--on-primary);border-radius:24px;padding:34px 22px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:10px;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);border-radius:18px;pointer-events:none}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:600;letter-spacing:.05em}
.brand-title{font-family:var(--font-text);font-size:clamp(40px,10vw,64px);color:var(--on-primary);margin:0}
.brand-title span{font-size:.45em;letter-spacing:.2em;opacity:.8;direction:ltr;display:inline-block}
.tagline{font-family:var(--font-text);font-size:clamp(20px,4.6vw,28px);color:var(--accent);margin:.2em 0 .6em}
.lead{max-width:620px;margin:0 auto 20px;opacity:.92}
.search{display:flex;gap:8px;max-width:520px;margin:0 auto}
.search input{flex:1;min-width:0;padding:13px 16px;border-radius:14px;border:2px solid transparent;background:#fff;color:#1b1b1b;font-size:16px}
.search input:focus{border-color:var(--accent);outline:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;transition:transform .15s,box-shadow .15s}
.btn:hover{text-decoration:none;box-shadow:var(--shadow)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#1b1b1b;border-color:var(--accent)}
.search .btn{background:var(--accent);color:#1b1b1b;border-color:var(--accent)}
.btn.solid{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.danger{color:var(--bad);border-color:var(--bad)}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:34px 0 14px}
.sec-head h2{margin:0;font-size:1.45rem}
.sec-head p{margin:0;color:var(--muted);font-size:.95rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);color:var(--text);transition:transform .2s,border-color .2s}
a.card:hover{text-decoration:none;transform:translateY(-3px);border-color:var(--accent)}
.sec-card h3{font-size:1.3rem;margin-bottom:.2em}
.sec-card p{margin:.2em 0 .7em;color:var(--muted);font-size:.95rem}
.sec-mark{display:inline-grid;place-items:center;min-width:56px;height:56px;padding:0 10px;border-radius:14px;background:var(--surface2);border:1px solid var(--accent);color:var(--accent-text);font-family:var(--font-text);font-size:1.4rem;font-weight:700;margin-bottom:10px}
.mini{margin:0 0 10px;padding:0;list-style:none;font-size:.9rem;color:var(--muted)}
.mini li{padding:3px 0;border-top:1px dashed var(--border)}
.more{color:var(--accent-text);font-weight:600;font-size:.92rem}

/* ---------- المظهر ---------- */
.theme-card{text-align:start;display:flex;flex-direction:column;gap:10px;cursor:pointer;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:14px}
.theme-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.preview{border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,.12);height:92px;display:flex;flex-direction:column}
.preview .pv-bar{height:26px;display:flex;align-items:center;padding:0 10px;gap:6px}
.preview .pv-bar i{width:8px;height:8px;border-radius:50%}
.preview .pv-body{flex:1;padding:10px;display:flex;flex-direction:column;gap:6px}
.preview .pv-body b{height:8px;border-radius:4px;display:block}
.swatches{display:flex;gap:6px}
.swatches i{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.theme-card strong{font-size:1.05rem;color:var(--head)}
.theme-card small{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:10px 18px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg button+button{border-inline-start:1px solid var(--border)}
.mode-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.mode-row span{color:var(--muted)}

/* ---------- القوائم والصفحات ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.crumbs a{color:var(--muted)}
.page-title{font-size:clamp(1.6rem,5vw,2.2rem);margin-bottom:.2em}
.page-sub{color:var(--muted);margin:0 0 18px}
.topic-list{display:grid;gap:12px}
.topic-item{display:flex;gap:14px;align-items:flex-start}
.topic-num{flex:none;width:42px;height:42px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700}
.topic-item h3{margin:0 0 .15em;font-size:1.12rem}
.topic-item p{margin:0;color:var(--muted);font-size:.93rem}
.pill{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--accent-text);margin-inline-end:6px;margin-top:6px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

/* ---------- صفحة الموضوع ---------- */
.topic-top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.fav-btn{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center}
.fav-btn svg{width:22px;height:22px;stroke:var(--accent-text);stroke-width:1.8;fill:none;stroke-linejoin:round}
.fav-btn[aria-pressed="true"]{background:var(--primary)}
.fav-btn[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.88rem;color:var(--text)}
.chip:hover{border-color:var(--accent)}
.reading{font-size:calc(var(--fs) * 1px);line-height:var(--lh);max-width:780px}
.reading .b-h{font-size:1.3em;margin-top:1.5em;padding-bottom:.25em;border-bottom:2px solid var(--accent);scroll-margin-top:80px}
.reading .b-p{margin:.6em 0}
.b-list{padding-inline-start:1.4em;margin:.5em 0}
.b-list li{margin:.25em 0}
.reading b{color:var(--head)}
.box{border-radius:var(--radius-sm);padding:12px 16px;margin:1em 0;background:var(--surface2);border:1px solid var(--border);border-inline-start:5px solid var(--accent)}
.box .box-title{font-weight:700;color:var(--accent-text);font-size:.85em;margin-bottom:2px}
.box.note{border-inline-start-color:var(--primary)}
.box.khilaf{border-style:dashed;border-inline-start-style:solid;border-inline-start-color:var(--accent-text)}
.table-wrap{overflow-x:auto;margin:1em 0;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.88em;min-width:460px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--primary);color:var(--on-primary);font-weight:600;white-space:nowrap}
tbody tr:nth-child(even){background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
.ex-list{display:grid;gap:10px;margin:1em 0}
.ex{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px}
.ex .ar{font-family:var(--font-text);font-size:1.25em;font-weight:700;color:var(--head);margin:0}
.ex .i3{margin:.3em 0 0;font-size:.88em;color:var(--muted);line-height:1.8}
.ex-title{font-weight:700;color:var(--accent-text);font-size:.9em;margin-top:1em}
.pager{display:flex;gap:10px;justify-content:space-between;margin:34px 0 10px;flex-wrap:wrap}
.pager a{flex:1 1 220px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;background:var(--surface);color:var(--text)}
.pager small{display:block;color:var(--muted)}

/* ---------- الاختبار ---------- */
.quiz{margin-top:34px;border:2px solid var(--accent);border-radius:var(--radius);padding:18px;background:var(--surface)}
.quiz h2{margin-top:0;font-size:1.3rem}
.quiz-opt-tag{font-size:.8rem;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:2px 10px;color:var(--muted);margin-inline-start:6px}
.q{padding:14px 0;border-top:1px dashed var(--border)}
.q-text{font-weight:600;margin:0 0 10px;font-size:1.02rem}
.q-text .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:.85rem;margin-inline-end:8px}
.opts{display:grid;gap:8px}
.opt{text-align:start;padding:11px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-family:var(--font-text);font-size:1.15rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;opacity:1}
.opt.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.fill{display:flex;gap:8px;flex-wrap:wrap}
.fill input{flex:1 1 180px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-family:var(--font-text);font-size:1.15rem}
.fill input:disabled{opacity:.85}
.fill input.correct{border-color:var(--ok);background:var(--ok-bg)}
.fill input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.why{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:.95rem;line-height:1.8}
.why.ok{background:var(--ok-bg);color:var(--ok)}
.why.no{background:var(--bad-bg);color:var(--bad)}
.why b{color:inherit}
.score{text-align:center;padding:16px;border-radius:12px;background:var(--surface2);margin-top:14px}
.score strong{font-size:1.6rem;color:var(--head)}

/* ---------- البحث والإعدادات ---------- */
.search-page input[type=search]{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--border);background:var(--surface);font-size:16px}
.search-page input[type=search]:focus{border-color:var(--accent);outline:0}
mark{background:color-mix(in srgb,var(--accent) 45%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.snip{margin:.4em 0 0;color:var(--muted);font-size:.92rem;line-height:1.8}
.set-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px dashed var(--border)}
.set-row:first-of-type{border-top:0}
.set-row label,.set-row .lbl{font-weight:600}
input[type=range]{width:min(260px,100%);accent-color:var(--accent-text)}
.sample{margin-top:12px;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-family:var(--font-text)}

/* ---------- التذييل ---------- */
.site-footer{background:var(--primary);color:var(--on-primary);border-top:3px solid var(--accent);padding:26px 0 30px;text-align:center}
.credit{display:inline-block;padding:14px 28px;border:1px solid var(--accent);border-radius:14px;margin-bottom:14px}
.credit-ar{font-family:var(--font-text);font-size:1.35rem;font-weight:700;color:var(--on-primary)}
.credit-en{font-size:1.05rem;letter-spacing:.14em;color:var(--accent);margin-top:2px}
.foot-links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.foot-links a{color:var(--on-primary);opacity:.9}
.tag{margin:0;font-family:var(--font-text);color:var(--accent);font-size:1.05rem}
.credit-card{text-align:center;border:1px solid var(--accent);border-radius:var(--radius);padding:22px;background:var(--surface2);margin:18px 0}

.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:520px){
  .hero{padding:28px 14px}
  .topic-top{flex-direction:row}
  .search{flex-direction:column}
}
@media print{.site-header,.site-footer,.quiz,.pager,.toc,.fav-btn{display:none!important}}

/* اسم الطالب في الترويسة */
.hdr-credit{display:flex;flex-direction:column;align-items:center;line-height:1.25;text-align:center;padding:2px 14px;border-inline:1px solid color-mix(in srgb,var(--accent) 55%,transparent);margin-inline:auto}
.hc-ar{font-size:13px;font-weight:600;color:var(--on-primary)}
.hc-en{font-size:11px;letter-spacing:.12em;color:var(--accent)}
@media(max-width:700px){
  .header-in{flex-wrap:wrap;row-gap:0;padding-block:4px 0}
  .hdr-credit{order:3;flex:0 0 100%;flex-direction:row;justify-content:center;gap:10px;border:0;border-top:1px solid color-mix(in srgb,var(--accent) 40%,transparent);padding:4px 0 6px;margin:2px 0 0}
  .hc-ar{font-size:12px}.hc-en{font-size:10.5px}
}

/* ===== الشعار وواجهة البداية ===== */
.mark{--g1:color-mix(in srgb,var(--accent) 78%,#fff);--g2:var(--accent);--g3:color-mix(in srgb,var(--accent) 72%,#000);--ink:var(--primary);--spine:var(--bg);display:block}
.brand-mark{width:38px;height:38px;--ink:var(--on-primary);--spine:var(--primary)}
.hero-mark{width:84px;height:84px;margin:0 auto 6px;--ink:var(--on-primary);--spine:var(--primary)}
.splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;
  background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--accent) 22%,var(--primary)) 0,var(--primary) 62%);color:var(--on-primary);
  animation:splash-out .7s ease 7s forwards}
.no-splash .splash{display:none}
.splash.closing{opacity:0;visibility:hidden;transition:opacity .55s ease,visibility 0s .55s}
.splash-in{display:flex;flex-direction:column;align-items:center;max-width:420px}

    { t: 'mcq', q: 'الصواب:', o: ['سماءً', 'سماءًا', 'سماءاً', 'سماءٌ'], a: 0, w: 'همزة بعد ألف: لا ألف.' },
    { t: 'tf', q: 'تُكتب «فتىً» دون إضافة ألف بعد التنوين.', a: true, w: 'الألف المقصورة تُغني عن ألف التنوين (وموضع الفتحتين فيها يختلف بحسب الرسم المتّبع).' }
  ] }

);

</script>
<script>
/* بَيَان | BAYAN — منطق التطبيق */
(function () {
  'use strict';

  var B = window.BAYAN;
  var main = document.getElementById('main');
  var root = document.documentElement;
  var KEY = 'bayan:v1';
  var DEF = { theme: 'emerald', mode: 'auto', fs: 19, lh: 1.9, favs: [], results: {} };
  var THEME_IDS = ['emerald', 'navy', 'burgundy'];

  if (!B || !main) { if (main) main.innerHTML = '<p class="box note">تعذّر تحميل بيانات التطبيق.</p>'; return; }

  /* ---------- التخزين ---------- */
  function load() {
    var s = {};
    try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { s = {}; }
    var o = {
      theme: THEME_IDS.indexOf(s.theme) > -1 ? s.theme : DEF.theme,
      mode: ['light', 'dark', 'auto'].indexOf(s.mode) > -1 ? s.mode : DEF.mode,
      fs: Math.min(26, Math.max(15, Number(s.fs) || DEF.fs)),
      lh: [1.7, 1.9, 2.1].indexOf(Number(s.lh)) > -1 ? Number(s.lh) : DEF.lh,
      favs: Array.isArray(s.favs) ? s.favs.filter(function (x) { return typeof x === 'string'; }) : [],
      results: (s.results && typeof s.results === 'object') ? s.results : {}
    };
    return o;
  }
  var S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* التخزين غير متاح */ } }

  /* ---------- شريط الأخطاء ---------- */
  function showErr(err) {
    if (window.console) console.error(err);
    try {
      var d = document.getElementById('err-bar');
      if (!d) {
        d = document.createElement('div'); d.id = 'err-bar'; d.setAttribute('role', 'alert');
        d.style.cssText = 'position:fixed;inset-inline:8px;bottom:8px;z-index:99;background:#8b1c1c;color:#fff;padding:8px 12px;border-radius:10px;font:13px/1.5 sans-serif;direction:ltr;text-align:left';
        document.body.appendChild(d);
      }
      d.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
    } catch (e2) { /* تجاهل */ }
  }

  /* ---------- أدوات ---------- */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function strip(h) { return String(h).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
  function topicById(id) { for (var i = 0; i < B.topics.length; i++) if (B.topics[i].id === id) return B.topics[i]; return null; }
  function sectionById(id) { for (var i = 0; i < B.sections.length; i++) if (B.sections[i].id === id) return B.sections[i]; return null; }
  function topicsOf(sec) { return B.topics.filter(function (t) { return t.sec === sec; }); }
  function ordered() {
    var out = [];
    B.sections.forEach(function (s) { out = out.concat(topicsOf(s.id)); });
    return out;
  }
  function isFav(id) { return S.favs.indexOf(id) > -1; }
  var BOOKMARK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

  /* ---------- المظهر ---------- */
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function resolvedMode() { return S.mode === 'auto' ? ((mq && mq.matches) ? 'dark' : 'light') : S.mode; }
  function applyPrefs() {
    root.setAttribute('data-theme', S.theme);
    root.setAttribute('data-mode', resolvedMode());
    root.style.setProperty('--fs', S.fs);
    root.style.setProperty('--lh', S.lh);
    var th = B.themes.filter(function (t) { return t.id === S.theme; })[0];
    var meta = document.getElementById('meta-theme');
    if (meta && th) meta.setAttribute('content', th.primary);
    var badge = document.getElementById('fav-badge');
    if (badge) { badge.textContent = S.favs.length; badge.hidden = S.favs.length === 0; }
    var mb = document.getElementById('mode-btn');
    if (mb) mb.setAttribute('aria-pressed', resolvedMode() === 'dark' ? 'true' : 'false');
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (S.mode === 'auto') applyPrefs(); });

  /* ---------- البحث ---------- */
  function norm(s) {
    var out = '', map = [];
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i), code = s.charCodeAt(i);
      if ((code >= 0x64B && code <= 0x65F) || code === 0x670 || code === 0x640 || code === 0x621) continue;
      if ('أإآٱ'.indexOf(c) > -1) c = 'ا';
      else if (c === 'ة') c = 'ه';
      else if (c === 'ى') c = 'ي';
      else if (c === 'ؤ') c = 'و';
      else if (c === 'ئ') c = 'ي';
      out += c.toLowerCase(); map.push(i);
    }
    return { n: out, m: map };
  }
  var INDEX = null;
  function buildIndex() {
    INDEX = B.topics.map(function (t) {
      var parts = [];
      t.blocks.forEach(function (b) {
        if (b.x) parts.push(strip(b.x));
        if (b.title) parts.push(b.title);
        if (b.items) b.items.forEach(function (it) { parts.push(typeof it === 'string' ? strip(it) : strip(it.s + ' ' + it.i)); });
        if (b.head) parts.push(b.head.join(' '));
        if (b.rows) b.rows.forEach(function (r) { parts.push(r.join(' ')); });
      });
      var body = parts.join(' ');
      return { t: t, title: norm(t.title).n, sum: norm(t.sum).n, body: body, nb: norm(body) };
    });
  }
  function search(q) {
    if (!INDEX) buildIndex();
    var toks = norm(q).n.split(/\s+/).filter(Boolean);
    if (!toks.length) return [];
    var res = [];
    INDEX.forEach(function (e) {
      var score = 0, ok = true;
      toks.forEach(function (tk) {
        var inT = e.title.indexOf(tk) > -1, inS = e.sum.indexOf(tk) > -1, inB = e.nb.n.indexOf(tk) > -1;
        if (!(inT || inS || inB)) ok = false;
        score += (inT ? 5 : 0) + (inS ? 2 : 0) + (inB ? 1 : 0);
      });
      if (ok) res.push({ e: e, score: score, tk: toks });
    });
    if (!res.length && toks.length > 1) {
      INDEX.forEach(function (e) {
        var score = 0;
        toks.forEach(function (tk) {
          if (e.title.indexOf(tk) > -1) score += 5;
          if (e.sum.indexOf(tk) > -1) score += 2;
          if (e.nb.n.indexOf(tk) > -1) score += 1;
        });
        if (score) res.push({ e: e, score: score, tk: toks });
      });
    }
    res.sort(function (a, b) { return b.score - a.score; });
    return res;
  }
  function snippet(r) {
    var e = r.e, tk = r.tk, idx = -1, len = 0;
    for (var i = 0; i < tk.length; i++) {
      var p = e.nb.n.indexOf(tk[i]);
      if (p > -1) { idx = p; len = tk[i].length; break; }
    }
    if (idx < 0) return esc(e.t.sum);
    var s0 = e.nb.m[idx], s1 = e.nb.m[Math.min(idx + len - 1, e.nb.m.length - 1)] + 1;
    var from = Math.max(0, s0 - 50), to = Math.min(e.body.length, s1 + 80);
    return (from > 0 ? '… ' : '') + esc(e.body.slice(from, s0)) + '<mark>' + esc(e.body.slice(s0, s1)) + '</mark>' + esc(e.body.slice(s1, to)) + (to < e.body.length ? ' …' : '');
  }

  /* ---------- مكونات العرض ---------- */
  function crumbs(list) {
    return '<nav class="crumbs" aria-label="مسار التنقل">' + list.map(function (c, i) {
      var last = i === list.length - 1;
      return (c.href && !last ? '<a href="' + c.href + '">' + c.t + '</a>' : '<span' + (last ? ' aria-current="page"' : '') + '>' + c.t + '</span>') + (last ? '' : '<span aria-hidden="true">›</span>');
    }).join('') + '</nav>';
  }
  function topicCard(t, i) {
    var sec = sectionById(t.sec), r = S.results[t.id];
    return '<a class="card topic-item" href="#/topic/' + t.id + '"><span class="topic-num" aria-hidden="true">' + (i + 1) + '</span><div><h3>' + t.title + '</h3><p>' + t.sum + '</p>' +
      '<span class="pill">' + sec.title + '</span>' + (isFav(t.id) ? '<span class="pill">في المفضلة</span>' : '') +
      (r ? '<span class="pill">آخر نتيجة: ' + r.s + '/' + r.t + '</span>' : '') + '</div></a>';
  }
  function footerCredit() {
    return '<div class="credit-card"><div class="credit-ar" style="font-family:var(--font-text);font-size:1.4rem;font-weight:700;color:var(--head)">إعداد الطالب: محمد بنيران</div>' +
      '<div dir="ltr" lang="en" style="letter-spacing:.14em;color:var(--accent-text);margin-top:2px">Mohammed Beniran</div></div>';
  }

  function renderBlock(b, i) {
    switch (b.t) {
      case 'h': return '<h2 class="b-h" id="s' + i + '">' + b.x + '</h2>';
      case 'p': return '<p class="b-p">' + b.x + '</p>';
      case 'list': return '<ul class="b-list">' + b.items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
      case 'rule': return '<aside class="box"><div class="box-title">' + (b.title || 'قاعدة') + '</div><div>' + b.x + '</div></aside>';
      case 'note': return '<aside class="box note"><div class="box-title">تنبيه</div><div>' + b.x + '</div></aside>';
      case 'khilaf': return '<aside class="box khilaf"><div class="box-title">خلاف علمي</div><div>' + b.x + '</div></aside>';
      case 'table':
        return '<div class="table-wrap" tabindex="0" role="region" aria-label="جدول"><table><thead><tr>' + b.head.map(function (h) { return '<th scope="col">' + h + '</th>'; }).join('') +
          '</tr></thead><tbody>' + b.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
      case 'ex':
        return '<div class="ex-title">أمثلة وإعراب</div><div class="ex-list">' + b.items.map(function (e) {
          return '<div class="ex"><p class="ar">' + e.s + '</p><p class="i3">' + e.i + '</p></div>';
        }).join('') + '</div>';
      default: return '';
    }
  }

  /* ---------- الاختبار ---------- */
  var Q = { id: null, started: false, ans: [] };
  function resetQuiz(id) { Q = { id: id, started: false, ans: [] }; }

  /* تطبيع الإجابات: التشكيل والتطويل، الهمزات، الألف المقصورة، التاء المربوطة، علامات الترقيم، المسافات، «ال» التعريف في أول الكلمة */
  function plainAns(s) {
    var x = String(s)
      .replace(/(\u064B\u0627|\u0627\u064B)(?=\s|$)/g, '')
      .replace(/[\u064B-\u065F\u0670\u0640\u06D6-\u06ED]/g, '')
      .replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627')
      .replace(/\u0624/g, '\u0648').replace(/\u0626/g, '\u064A')
      .replace(/\u0649/g, '\u064A').replace(/\u0629/g, '\u0647')
      .replace(/[\u060C\u061B\u061F.,;:!?\u00AB\u00BB"'()\[\]{}\u2026\-]/g, ' ')
      .replace(/\s+/g, ' ').trim();
    return x.split(' ').map(function (w) { return (w.length > 4 && w.indexOf('\u0627\u0644') === 0) ? w.slice(2) : w; }).join(' ');
  }
  function checkFill(q, v) {
    var cands = [q.a].concat(q.alts || []).map(plainAns), x = plainAns(v);
    return x.length > 0 && cands.indexOf(x) > -1;
  }
  function quizHTML(t) {
    var r = S.results[t.id];
    var head = '<h2>اختبر نفسك <span class="quiz-opt-tag">اختياري</span></h2>';
    if (!Q.started) {
      return '<section class="quiz" id="quiz" aria-labelledby="quiz-h">' + head.replace('<h2>', '<h2 id="quiz-h">') +
        '<p>' + t.quiz.length + ' أسئلة على هذا الموضوع مع تصحيح فوري وبيان سبب الإجابة.' + (r ? ' آخر نتيجة لك: <b>' + r.s + ' من ' + r.t + '</b>.' : '') + '</p>' +
        '<button class="btn solid" type="button" data-action="quiz-start">ابدأ الاختبار</button></section>';
    }
    var done = Q.ans.filter(function (a) { return a; }).length, score = Q.ans.filter(function (a) { return a && a.ok; }).length;
    var html = '<section class="quiz" id="quiz" aria-labelledby="quiz-h">' + head.replace('<h2>', '<h2 id="quiz-h">');
    t.quiz.forEach(function (q, i) {
      var a = Q.ans[i];
      html += '<div class="q" id="q' + i + '"><p class="q-text"><span class="n">' + (i + 1) + '</span>' + q.q + '</p>';
      if (q.t === 'mcq') {
        html += '<div class="opts">' + q.o.map(function (o, j) {
          var cls = '';
          if (a) cls = j === q.a ? ' correct' : (j === a.v ? ' wrong' : '');
          return '<button type="button" class="opt' + cls + '" data-action="ans" data-q="' + i + '" data-v="' + j + '"' + (a ? ' disabled' : '') + '>' + o + '</button>';
        }).join('') + '</div>';
      } else if (q.t === 'tf') {
        html += '<div class="opts">' + [['1', 'صح'], ['0', 'خطأ']].map(function (o) {
          var isRight = (o[0] === '1') === q.a, cls = '';
          if (a) cls = isRight ? ' correct' : (a.v === o[0] ? ' wrong' : '');
          return '<button type="button" class="opt' + cls + '" data-action="ans" data-q="' + i + '" data-v="' + o[0] + '"' + (a ? ' disabled' : '') + '>' + o[1] + '</button>';
        }).join('') + '</div>';
      } else {
        html += '<div class="fill"><input type="text" id="f' + i + '" dir="rtl" lang="ar" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="إجابتك" value="' + (a ? esc(a.v) : '') + '"' + (a ? ' disabled class="' + (a.ok ? 'correct' : 'wrong') + '"' : '') + '>' +
          (a ? '' : '<button type="button" class="btn solid" data-action="fill" data-q="' + i + '">تحقق</button>') + '</div>';
      }
      if (a) {
        html += '<div class="why ' + (a.ok ? 'ok' : 'no') + '" role="status"><b>' + (a.ok ? 'إجابة صحيحة. ' : 'إجابة غير صحيحة. ') + '</b>' +
          (!a.ok && q.t === 'fill' ? 'الإجابة الصحيحة: <b>' + esc(q.a) + '</b>. ' : '') + q.w + '</div>';
      }
      html += '</div>';
    });
    if (done === t.quiz.length) {
      html += '<div class="score" role="status"><div>نتيجتك</div><strong>' + score + ' من ' + t.quiz.length + '</strong><div style="margin-top:12px"><button class="btn" type="button" data-action="quiz-reset">أعد الاختبار</button></div></div>';
    }
    return html + '</section>';
  }
  function refreshQuiz(t, keepScroll) {
    var el = document.getElementById('quiz');
    if (!el) return;

    if (keepScroll) window.scrollTo(0, y);
  }
  function answer(qi, v) {
    var t = topicById(Q.id);
    if (!t || Q.ans[qi]) return;
    var q = t.quiz[qi], ok;
    if (q.t === 'mcq') ok = Number(v) === q.a;
    else if (q.t === 'tf') ok = (v === '1') === q.a;
    else { if (!plainAns(v)) return; ok = checkFill(q, v); }
    Q.ans[qi] = { v: v, ok: ok };
    var n = 0, s = 0;
    for (var i = 0; i < t.quiz.length; i++) { if (Q.ans[i]) { n++; if (Q.ans[i].ok) s++; } }
    if (n === t.quiz.length) { S.results[t.id] = { s: s, t: t.quiz.length }; save(); }
    refreshQuiz(t, true);
  }

  /* ---------- الصفحات ---------- */
  function viewHome() {
    var secs = B.sections.map(function (s) {
      var ts = topicsOf(s.id);
      return '<a class="card sec-card" href="#/section/' + s.id + '"><span class="sec-mark" aria-hidden="true">' + s.mark + '</span><h3>' + s.title + '</h3><p>' + s.blurb + '</p><ul class="mini">' +
        ts.slice(0, 3).map(function (t) { return '<li>' + t.title + '</li>'; }).join('') + '</ul><span class="more">' + ts.length + ' موضوعات ←</span></a>';
    }).join('');
    return '<section class="hero fade"><svg class="mark hero-mark" viewBox="0 0 120 120" aria-hidden="true"><use href="#bayan-mark"/></svg><p class="eyebrow">موسوعة تفاعلية للنحو والصرف والإملاء</p><h1 class="brand-title">بَيَان <span>| BAYAN</span></h1>' +
      '<p class="tagline">رحلة في أسرار اللغة العربية</p>' +
      '<p class="lead">شروحات دقيقة وأمثلة معربة وجداول مرتبة، مع اختبارات اختيارية في نهاية كل موضوع.</p>' +
      '<form class="search" role="search" data-form="hero-search"><input type="search" name="q" placeholder="ابحث: المبتدأ، الهمزة، اسم الفاعل…" aria-label="ابحث في الموسوعة" autocomplete="off"><button class="btn" type="submit">بحث</button></form></section>' +
      '<div class="sec-head"><h2>الأقسام</h2><p>اختر علمًا لتبدأ</p></div><div class="grid">' + secs + '</div>' +
      '<div class="sec-head" id="appearance"><h2>المظهر</h2><p>اختر الثيم الذي يريحك</p></div>' + appearanceHTML() +
      footerCredit();
  }
  function appearanceHTML() {
    var cards = B.themes.map(function (t) {
      return '<button type="button" class="card theme-card" data-action="theme" data-id="' + t.id + '" aria-pressed="' + (S.theme === t.id) + '">' +
        '<span class="preview" aria-hidden="true" style="background:' + t.bg + '"><span class="pv-bar" style="background:' + t.primary + '"><i style="background:' + t.accent + '"></i><i style="background:' + t.secondary + '"></i></span>' +
        '<span class="pv-body"><b style="background:' + t.primary + ';width:70%"></b><b style="background:' + t.secondary + ';width:92%"></b><b style="background:' + t.accent + ';width:45%"></b></span></span>' +
        '<span class="swatches" aria-hidden="true"><i style="background:' + t.primary + '"></i><i style="background:' + t.secondary + '"></i><i style="background:' + t.bg + '"></i><i style="background:' + t.accent + '"></i></span>' +
        '<strong>' + t.name + '</strong><small>' + t.hint + (S.theme === t.id ? ' — مُفعَّل' : '') + '</small></button>';
    }).join('');
    return '<div class="grid">' + cards + '</div>' + modeControl();
  }
  function segMode() {
    var opts = [['light', 'فاتح'], ['dark', 'ليلي'], ['auto', 'تلقائي']];
    return '<div class="seg" role="group" aria-label="الوضع">' + opts.map(function (o) {
      return '<button type="button" data-action="mode" data-v="' + o[0] + '" aria-pressed="' + (S.mode === o[0]) + '">' + o[1] + '</button>';
    }).join('') + '</div>';
  }
  function modeControl() {
    return '<div class="mode-row"><span>الوضع الليلي:</span>' + segMode() + '</div>';
  }

  function viewSection(id) {
    var s = sectionById(id);
    if (!s) return viewNotFound();
    var ts = topicsOf(id);
    document.title = s.title + ' — بَيَان';
    return crumbs([{ t: 'الرئيسية', href: '#/' }, { t: s.title }]) + '<h1 class="page-title">' + s.title + '</h1><p class="page-sub">' + s.blurb + '</p>' +
      '<div class="topic-list">' + ts.map(topicCard).join('') + '</div>';
  }

  function viewTopic(id) {
    var t = topicById(id);
    if (!t) return viewNotFound();
    if (Q.id !== id) resetQuiz(id);
    var sec = sectionById(t.sec), all = ordered(), pos = all.indexOf(t);
    var prev = all[pos - 1], next = all[pos + 1];
    document.title = t.title + ' — بَيَان';
    var toc = '';
    t.blocks.forEach(function (b, i) { if (b.t === 'h') toc += '<button type="button" class="chip" data-action="scroll" data-to="s' + i + '">' + b.x + '</button>'; });
    var body = t.blocks.map(renderBlock).join('');
    return crumbs([{ t: 'الرئيسية', href: '#/' }, { t: sec.title, href: '#/section/' + sec.id }, { t: t.title }]) +
      '<div class="topic-top"><div><h1 class="page-title">' + t.title + '</h1><p class="page-sub">' + t.sum + '</p></div>' +
      '<button type="button" class="fav-btn" data-action="fav" data-id="' + t.id + '" aria-pressed="' + isFav(t.id) + '" aria-label="' + (isFav(t.id) ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة') + '">' + BOOKMARK + '</button></div>' +
      (toc ? '<div class="toc" aria-label="محتويات الموضوع">' + toc + '</div>' : '') +
      '<article class="reading fade">' + body + '</article><p class="refs-link">للتوسع: <a href="#/sources">مراجع علم ' + sec.title + '</a></p>' + quizHTML(t) +
      '<nav class="pager" aria-label="التنقل بين الموضوعات">' +
      (next ? '<a href="#/topic/' + next.id + '"><small>الموضوع التالي ←</small>' + next.title + '</a>' : '') +
      (prev ? '<a href="#/topic/' + prev.id + '"><small>→ الموضوع السابق</small>' + prev.title + '</a>' : '') + '</nav>';
  }

  function viewFavorites() {
    document.title = 'المفضلة — بَيَان';
    var ts = S.favs.map(topicById).filter(Boolean);
    return crumbs([{ t: 'الرئيسية', href: '#/' }, { t: 'المفضلة' }]) + '<h1 class="page-title">المفضلة</h1>' +
      (ts.length ? '<div class="topic-list">' + ts.map(topicCard).join('') + '</div>' :
        '<div class="empty"><p>لم تضف أي موضوع إلى المفضلة بعد.</p><p>افتح أي موضوع واضغط على أيقونة العلامة لحفظه هنا.</p><a class="btn solid" href="#/section/nahw">ابدأ من النحو</a></div>');
  }

  function viewSearch(q) {
    document.title = 'بحث — بَيَان';
    return crumbs([{ t: 'الرئيسية', href: '#/' }, { t: 'بحث' }]) + '<h1 class="page-title">البحث</h1><div class="search-page">' +
      '<input type="search" id="q" value="' + esc(q) + '" placeholder="اكتب كلمة أو أكثر…" aria-label="ابحث في الموسوعة" autocomplete="off"></div>' +
      '<div id="results" aria-live="polite">' + resultsHTML(q) + '</div>';
  }
  function resultsHTML(q) {
    if (!q.trim()) return '<p class="page-sub" style="margin-top:14px">يبحث في العناوين والشروحات والأمثلة، ولا يتأثر بالتشكيل أو شكل الهمزة.</p>';
    var rs = search(q);
    if (!rs.length) return '<div class="empty"><p>لا نتائج للبحث عن «' + esc(q) + '».</p><p>جرّب كلمة أخرى أو تصفح الأقسام.</p></div>';
    return '<p class="page-sub" style="margin-top:14px">' + rs.length + ' نتيجة</p><div class="topic-list">' + rs.map(function (r) {
      var t = r.e.t;
      return '<a class="card" href="#/topic/' + t.id + '"><h3 style="margin:0">' + t.title + '</h3><span class="pill">' + sectionById(t.sec).title + '</span><p class="snip">' + snippet(r) + '</p></a>';
    }).join('') + '</div>';
  }

  function viewSettings() {
    document.title = 'الإعدادات — بَيَان';
    var lhs = [[1.7, 'مضغوط'], [1.9, 'متوسط'], [2.1, 'واسع']];
    return crumbs([{ t: 'الرئيسية', href: '#/' }, { t: 'الإعدادات' }]) + '<h1 class="page-title">الإعدادات</h1>' +
      '<div class="card">' +
      '<div class="set-row"><label for="fs">حجم الخط: <b id="fs-v">' + S.fs + '</b></label><input type="range" id="fs" min="15" max="26" step="1" value="' + S.fs + '"></div>' +
      '<div class="set-row"><span class="lbl">تباعد الأسطر</span><div class="seg" role="group" aria-label="تباعد الأسطر">' + lhs.map(function (o) {
        return '<button type="button" data-action="lh" data-v="' + o[0] + '" aria-pressed="' + (S.lh === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="set-row"><span class="lbl">الوضع الليلي</span>' + segMode() + '</div>' +
      pwaRow() +
      '<div class="set-row"><span class="lbl">المظهر (الثيم)</span><a class="btn" href="#/appearance">تغيير من الصفحة الرئيسية</a></div>' +
      '<div class="sample reading" id="sample"><b>معاينة القراءة:</b> العلمُ نورٌ، والجهلُ ظلامٌ؛ فاطلبِ العلمَ تهتدِ.</div>' +
      '<div class="set-row"><span class="lbl">البيانات المحفوظة</span><span><button class="btn" type="button" data-action="reset-prefs">إعادة الإعدادات</button> <button class="btn danger" type="button" data-action="clear-data">مسح المفضلة والنتائج</button></span></div>' +
      '</div><p class="page-sub" style="margin-top:12px">تُحفظ تفضيلاتك تلقائيًا في هذا المتصفح فقط.</p>';
  }

  function viewAbout() {
    document.title = 'حول التطبيق — بَيَان';
    return crumbs([{ t: 'الرئيسية', href: '#/' }, { t: 'حول التطبيق' }]) + '<h1 class="page-title">حول التطبيق</h1>' +
      '<div class="reading"><p class="b-p"><b>بَيَان | BAYAN</b> موسوعة تعليمية تفاعلية لعلوم النحو والصرف والإملاء العربي، شعارها: «رحلة في أسرار اللغة العربية». تجمع القواعد والتعريفات والأمثلة المعربة والجداول، وتضيف اختبارات اختيارية في نهاية كل موضوع.</p>' +
      '<h2 class="b-h">ما يقدمه التطبيق</h2><ul class="b-list"><li>' + B.topics.length + ' موضوعًا في ثلاثة أقسام: النحو والصرف والإملاء.</li><li>ثلاثة ثيمات ووضع ليلي وتحكم في حجم الخط وتباعد الأسطر.</li><li>بحث في كامل المحتوى، ومفضلة، وحفظ التفضيلات في المتصفح.</li><li>يعمل دون اتصال بالإنترنت: نسخة الملف الواحد بعد حفظها على الجهاز، ونسخة التطبيق المنشورة (PWA) بعد فتحها مرة واحدة بالإنترنت، ويمكن تثبيتها على الهاتف.</li></ul>' +
      '<h2 class="b-h">للاستزادة</h2><p class="b-p">انظر صفحة <a href="#/sources">المراجع العلمية</a>.</p></div>' +
      footerCredit();
  }

  function viewSources() {
    document.title = 'المراجع — بَيَان';
    var html = crumbs([{ t: 'الرئيسية', href: '#/' }, { t: 'المراجع' }]) + '<h1 class="page-title">المراجع العلمية</h1>' +
      '<p class="page-sub">كتب معروفة يُرجع إليها للتوسع في كل علم.</p><div class="reading">';
    B.sections.forEach(function (s) {
      html += '<h2 class="b-h" id="refs-' + s.id + '">' + s.title + '</h2><ul class="b-list">' + (B.refs[s.id] || []).map(function (r) { return '<li>' + r + '</li>'; }).join('') + '</ul>';
    });
    html += '<aside class="box note"><div class="box-title">تنبيه صريح</div><div>هذه مراجع عامة للاستزادة، ولم أنسب فيها صفحات ولا طبعات، ولم أوثّق كل مسألة بمرجع بعينه. ما عُرض من خلاف بين النحاة والصرفيين مبنيّ على كتب الخلاف المعروفة، فإذا احتجتَ توثيقًا دقيقًا لمسألة فارجع إلى الكتاب المناسب مباشرة. ويُنصح بمراجعة المحتوى مع معلّم مختص.</div></aside></div>' + footerCredit();
    return html;
  }
  function pwaRow() {
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches) || window.navigator.standalone;
    var sw = ('serviceWorker' in navigator) && navigator.serviceWorker.controller;
    var line = sw ? 'جاهز للعمل دون إنترنت.' : (/^https?:$/.test(location.protocol) ? 'سيصبح جاهزًا للعمل دون إنترنت بعد إعادة فتح التطبيق مرة واحدة.' : 'العمل دون إنترنت بمشغّل الملفات يتطلب فتح التطبيق من رابط https؛ أما ملف HTML الواحد فيعمل دون إنترنت بعد حفظه على الجهاز.');
    var act = standalone ? '<b>مثبّت على جهازك.</b>' : (deferredInstall ? '<button class="btn solid" type="button" data-action="install">تثبيت التطبيق</button>' : 'للتثبيت: في Chrome على أندرويد افتح القائمة ⋮ ثم «تثبيت التطبيق»، وفي Safari على آيفون اضغط «مشاركة» ثم «إضافة إلى الشاشة الرئيسية».');
    return '<div class="set-row"><span class="lbl">التثبيت والعمل دون إنترنت</span><span>' + act + '<br><small>' + line + '</small></span></div>';
  }
  var deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; if (/^#\/settings/.test(location.hash || CUR)) route(CUR); });
  window.addEventListener('appinstalled', function () { deferredInstall = null; });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { try { navigator.serviceWorker.register('sw.js').catch(function () { /* تجاهل */ }); } catch (e) { /* تجاهل */ } });
  }

  function viewNotFound() {
    document.title = 'الصفحة غير موجودة — بَيَان';
    return '<div class="empty"><h1 class="page-title">الصفحة غير موجودة</h1><p>الرابط الذي فتحته غير صحيح.</p><a class="btn solid" href="#/">العودة إلى الرئيسية</a></div>';
  }

  /* ---------- التوجيه ---------- */
  var CUR = '';
  function route(hash) {
    var raw = (typeof hash === 'string') ? hash : (location.hash || '');
    CUR = raw;
    var h = raw.replace(/^#\/?/, ''), qs = '';
    var qi = h.indexOf('?');
    if (qi > -1) { qs = h.slice(qi + 1); h = h.slice(0, qi); }
    var p = h.split('/').filter(Boolean), html, scrollTo = null;
    try {
      var name = p[0] || '';
      if (name === '') { html = viewHome(); document.title = 'بَيَان | BAYAN — رحلة في أسرار اللغة العربية'; }
      else if (name === 'appearance') { html = viewHome(); scrollTo = 'appearance'; }
      else if (name === 'section') html = viewSection(p[1]);
      else if (name === 'topic') html = viewTopic(decodeURIComponent(p[1] || ''));
      else if (name === 'favorites') html = viewFavorites();
      else if (name === 'search') {
        var m = /(?:^|&)q=([^&]*)/.exec(qs), q = '';
        try { q = m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''; } catch (e) { q = ''; }
        html = viewSearch(q);
      }
      else if (name === 'settings') html = viewSettings();
      else if (name === 'about') html = viewAbout();
      else if (name === 'sources') html = viewSources();
      else html = viewNotFound();
    } catch (err) {
      if (window.console) console.error(err);
      html = '<div class="empty"><h1 class="page-title">حدث خطأ غير متوقع</h1><p>تعذّر عرض هذه الصفحة.</p><a class="btn solid" href="#/">العودة إلى الرئيسية</a></div>';
    }
    main.innerHTML = html;
    applyPrefs();
    if (scrollTo) {
      var el = document.getElementById(scrollTo);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else window.scrollTo(0, 0);
    if (p[0] === 'search') { var qi2 = document.getElementById('q'); if (qi2 && !qi2.value) qi2.focus(); }
  }

  /* ---------- واجهة البداية ---------- */
  var splashTimer = null;
  function closeSplash() {
    var sp = document.getElementById('splash');
    if (splashTimer) { clearTimeout(splashTimer); splashTimer = null; }
    try { sessionStorage.setItem('bayan:splash', '1'); } catch (e) { /* تجاهل */ }
    if (!sp) return;
    sp.classList.add('closing');
    setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 700);
  }
  function initSplash() {
    var sp = document.getElementById('splash');
    if (!sp) return;
    if (root.className.indexOf('no-splash') > -1) { sp.parentNode.removeChild(sp); return; }
    splashTimer = setTimeout(closeSplash, 5200);
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.getElementById('splash')) closeSplash(); });

  /* ---------- الأحداث ---------- */
  function doAction(target) {
    var el = target && target.closest ? target.closest('[data-action]') : null;
    if (!el) return false;
    var a = el.getAttribute('data-action'), d = el.dataset;
    try {
      switch (a) {
        case 'theme':
          S.theme = d.id; save(); applyPrefs();
          document.querySelectorAll('[data-action="theme"]').forEach(function (b) {
            var on = b.getAttribute('data-id') === S.theme;
            b.setAttribute('aria-pressed', on);
            var sm = b.querySelector('small'), th = B.themes.filter(function (t) { return t.id === b.getAttribute('data-id'); })[0];
            if (sm && th) sm.textContent = th.hint + (on ? ' — مُفعَّل' : '');
          });
          break;
        case 'mode':
          S.mode = d.v; save(); applyPrefs();
          document.querySelectorAll('[data-action="mode"]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === S.mode); });
          break;
        case 'toggle-mode':
          S.mode = resolvedMode() === 'dark' ? 'light' : 'dark'; save(); applyPrefs();
          document.querySelectorAll('[data-action="mode"]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === S.mode); });
          break;
        case 'lh':
          S.lh = Number(d.v); save(); applyPrefs();
          document.querySelectorAll('[data-action="lh"]').forEach(function (b) { b.setAttribute('aria-pressed', Number(b.getAttribute('data-v')) === S.lh); });
          break;
        case 'fav':
          var i = S.favs.indexOf(d.id);
          if (i > -1) S.favs.splice(i, 1); else S.favs.push(d.id);
          save(); applyPrefs();
          el.setAttribute('aria-pressed', isFav(d.id));
          el.setAttribute('aria-label', isFav(d.id) ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة');
          break;
        case 'splash-close': closeSplash(); break;
        case 'install':
          if (deferredInstall) { var di = deferredInstall; deferredInstall = null; di.prompt(); route(CUR); }
          break;
        case 'scroll':
          var t = document.getElementById(d.to); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
          break;
        case 'quiz-start':
          Q.started = true; Q.ans = []; refreshQuiz(topicById(Q.id), false);
          var qz = document.getElementById('quiz'); if (qz) qz.scrollIntoView({ behavior: 'smooth', block: 'start' });
          break;
        case 'quiz-reset':
          Q.started = true; Q.ans = []; refreshQuiz(topicById(Q.id), false);
          var qz2 = document.getElementById('quiz'); if (qz2) qz2.scrollIntoView({ behavior: 'smooth', block: 'start' });
          break;
        case 'ans': answer(Number(d.q), d.v); break;
        case 'fill':
          var inp = document.getElementById('f' + d.q);
          if (inp) answer(Number(d.q), inp.value);
          break;
        case 'reset-prefs':
          S.theme = DEF.theme; S.mode = DEF.mode; S.fs = DEF.fs; S.lh = DEF.lh; save(); applyPrefs(); route(CUR);
          break;
        case 'clear-data':
          if (window.confirm('سيتم مسح المفضلة ونتائج الاختبارات. هل تريد المتابعة؟')) { S.favs = []; S.results = {}; save(); applyPrefs(); route(CUR); }
          break;
      }
    } catch (err) { showErr(err); }
    return true;
  }

  function onInput(e) {
    var t = e.target;
    if (t.id === 'fs') {
      S.fs = Number(t.value); save(); applyPrefs();
      var v = document.getElementById('fs-v'); if (v) v.textContent = S.fs;
    } else if (t.id === 'q') {
      var q = t.value;
      if (t.getAttribute('data-last') === q) return;
      t.setAttribute('data-last', q);
      document.getElementById('results').innerHTML = resultsHTML(q);
      try { history.replaceState(null, '', '#/search' + (q ? '?q=' + encodeURIComponent(q) : '')); } catch (err) { /* تجاهل */ }
    }
  }
  ['input', 'keyup', 'change', 'search', 'compositionend'].forEach(function (ev) { document.addEventListener(ev, onInput); });

  document.addEventListener('submit', function (e) {
    if (e.target.getAttribute && e.target.getAttribute('data-form') === 'hero-search') {
      e.preventDefault();
      doSearchForm(e.target);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && /^f\d+$/.test(e.target.id || '')) {
      e.preventDefault();
      answer(Number(e.target.id.slice(1)), e.target.value);
    }
  });

  /* تنقّل موثوق حتى في المعاينات التي لا تُطلق hashchange (iframe/عارض الملفات) */
  function go(h) {
    route(h);
    try { if (location.hash !== h) location.hash = h; } catch (e) { /* تجاهل */ }
  }
  function doSearchForm(form) {
    var q = (form.elements.q.value || '').trim();
    go('#/search' + (q ? '?q=' + encodeURIComponent(q) : ''));
  }
  /* يعالج الضغط/اللمس ويعيد true إن كان هدفًا تفاعليًا */
  function activate(target) {
    if (!target || !target.closest) return false;
    try {
      if (doAction(target)) return true;
      var btn = target.closest('form[data-form="hero-search"] button');
      if (btn) { doSearchForm(btn.form || target.closest('form')); return true; }
      var a = target.closest('a[href^="#/"]');
      if (a) { go(a.getAttribute('href')); return true; }
    } catch (err) { showErr(err); }
    return false;
  }
  var skipClickUntil = 0, tStart = null;
  document.addEventListener('touchstart', function (e) {
    var t = e.touches && e.touches[0];
    tStart = t ? { x: t.clientX, y: t.clientY, tg: e.target, at: Date.now() } : null;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    var t = e.changedTouches && e.changedTouches[0];
    if (!tStart || !t) return;
    var moved = Math.abs(t.clientX - tStart.x) > 10 || Math.abs(t.clientY - tStart.y) > 10;
    var tg = tStart.tg, dur = Date.now() - tStart.at; tStart = null;
    if (moved || dur > 600) return;
    if (tg.closest && tg.closest('input,textarea,select,label')) return;
    if (activate(tg)) { skipClickUntil = Date.now() + 700; if (e.cancelable) e.preventDefault(); }
  }, { passive: false });
  document.addEventListener('click', function (e) {
    if (Date.now() < skipClickUntil) { e.preventDefault(); return; }
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button > 0) return;
    if (e.target && e.target.closest && e.target.closest('a[href^="#/"],[data-action],form[data-form] button')) {
      if (activate(e.target)) e.preventDefault();
    }
  });
  window.addEventListener('hashchange', function () { if ((location.hash || '') !== CUR) route(); });
  window.addEventListener('error', function (e) { showErr(e.message || 'خطأ'); });

  applyPrefs();
  route();
  initSplash();
})();

</script>
</body>
</html>
